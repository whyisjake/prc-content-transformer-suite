name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and package plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build JS/CSS assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      # Both loops below derive from the contents of plugins/ rather than a
      # hand-written list, which is what keeps them from drifting again.
      #
      # prc-scripts is the one exclusion, and it is deliberate. It is not a
      # released plugin: it exists so the @prc/* packages under
      # includes/scripts/src have somewhere to live, and consuming plugins
      # compile those into their own bundles at build time. Shipping it would
      # only reintroduce the runtime coupling this arrangement removes.
      - name: Install PHP dependencies
        run: |
          for dir in plugins/*/; do
            [ "$(basename "$dir")" = "prc-scripts" ] && continue
            [ -f "$dir/composer.json" ] || continue
            echo "::group::composer install ${dir}"
            ( cd "$dir" && composer install --no-dev --optimize-autoloader --classmap-authoritative )
            echo "::endgroup::"
          done

      - name: Sanitize icon library (verify no Pro sprites)
        run: bash plugins/prc-icon-library/bin/sanitize-public-release.sh

      - name: Create dist directory
        run: mkdir -p dist

      - name: Package plugins
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            [ "$name" = "prc-scripts" ] && continue
            zip -r "dist/${name}.zip" "plugins/${name}" \
              --exclude "*/node_modules/*" --exclude "*/.git/*"
          done
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
